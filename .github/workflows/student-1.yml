name: student-1-ci

on:
  push:
    paths:
      - "student-1/**"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"
      - ".github/workflows/student-1.yml"
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r "student-1/backend/requirements.txt"

      - name: Install frontend dependencies
        run: pip install -r "student-1/frontend/requirements.txt"

      - name: Syntax check (compile all Python files)
        run: |
          python -m py_compile "student-1/backend/app.py"
          python -m py_compile "student-1/backend/init_db.py"
          python -m py_compile "student-1/frontend/app.py"

      - name: Confirm MCP/RAG disabled in CI (unreachable local URLs)
        run: |
          echo "MCP_URL and RAG_URL are not set in CI, so they default to localhost ports with no live servers running."
          echo "This intentionally exercises the graceful-fallback path rather than live MCP/RAG calls."

      - name: Pre-commit validation (pytest)
        run: |
          cd "student-1"
          python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t student-1-image "./student-1"
  
  post-commit-ai-unit-testing:
    needs: build-and-validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: AI-assisted unit test suggestions (skips cleanly if AI-Mode is unreachable)
        working-directory: student-1
        env:
          AI_MODE_URL: ${{ secrets.AI_MODE_URL || 'http://localhost:8000' }}
        run: python tests/ai_assisted_tests.py
      - name: Upload AI test suggestions
        uses: actions/upload-artifact@v4
        with:
          name: student-1-ai-test-suggestions
          path: student-1/ai_test_suggestions.md
          if-no-files-found: ignore