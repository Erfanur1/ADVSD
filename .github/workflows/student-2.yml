name: student-2-ci

on:
  push:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2.yml"
  pull_request:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2.yml"
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    env:
      # Release 1: MCP + RAG integration is retained but disabled in CI/CD
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r "student-2/backend/requirements.txt"

      - name: Install frontend dependencies
        run: pip install -r "student-2/frontend/requirements.txt"

      - name: Install test dependencies
        run: pip install pytest

      - name: Syntax check (compile all Python files)
        run: |
          python -m py_compile "student-2/backend/app.py"
          python -m py_compile "student-2/backend/init_db.py"
          python -m py_compile "student-2/frontend/app.py"

      - name: Run pytest
        run: |
          cd "student-2"
          python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t student-2-image "./student-2"

      - name: Smoke test container with MCP/RAG disabled
        run: |
          docker run -d --name s2 -p 5002:5002 -e DB_PATH=/tmp/s2.db \
            -e MCP_ENABLED=false -e RAG_ENABLED=false student-2-image
          for i in $(seq 1 20); do curl -sf http://localhost:5002/health && break; sleep 1; done
          echo; echo "--- MCP (expect disabled) ---"
          curl -s -X POST http://localhost:5002/mcp/execute -H 'Content-Type: application/json' \
            -d '{"tool":"validate_portfolio","parameters":{"portfolio_id":1}}' | tee mcp.json
          grep -q '"disabled"' mcp.json
          echo; echo "--- RAG (expect disabled) ---"
          curl -s -X POST http://localhost:5002/rag/ask -H 'Content-Type: application/json' \
            -d '{"query":"test"}' | tee rag.json
          grep -q '"disabled"' rag.json
          docker rm -f s2
