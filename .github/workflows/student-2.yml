name: student-2-ci

on:
  push:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2.yml"
  pull_request:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2.yml"
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r "student-2/backend/requirements.txt"

      - name: Install frontend dependencies
        run: pip install -r "student-2/frontend/requirements.txt"

      - name: Syntax check (compile all Python files)
        run: |
          python -m py_compile "student-2/backend/app.py"
          python -m py_compile "student-2/backend/init_db.py"
          python -m py_compile "student-2/frontend/app.py"

      - name: Run pytest
        run: |
          cd "student-2"
          python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t student-2-image "./student-2"
