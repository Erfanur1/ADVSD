name: cloud-deployment

# Deploys the app to Azure Container Apps, but only AFTER the required
# CI/CD validation (the four student-N-ci workflows) has succeeded on main.
# Can also be run by hand from the Actions tab (workflow_dispatch).
on:
  workflow_run:
    workflows:
      - student-1-ci
      - student-2-ci
      - student-3-ci
      - student-4-ci
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deployments at the same time
concurrency:
  group: cloud-deployment
  cancel-in-progress: false

env:
  RESOURCE_GROUP: group29-r2-rg
  LOCATION: australiaeast
  NAME_PREFIX: group29r2

jobs:
  deploy:
    # For workflow_run: only deploy if the triggering CI run succeeded.
    # Manual runs (workflow_dispatch) always proceed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy infrastructure and containers
        run: bash scripts/deploy/azure/deploy.sh
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          LOCATION: ${{ env.LOCATION }}
          NAME_PREFIX: ${{ env.NAME_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Smoke test deployed apps
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" --name main \
            --query "properties.outputs" -o json)
          for key in homeUrl student1Url student2Url student3Url student4Url; do
            url=$(echo "$OUTPUTS" | jq -r ".${key}.value")
            echo "Checking $key -> $url"
            curl -fsS --retry 10 --retry-delay 15 --retry-all-errors -o /dev/null "$url"
          done
          echo "All deployed apps responded."